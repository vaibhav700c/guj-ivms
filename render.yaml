# Render Blueprint — deploys the backend + managed PostgreSQL.
# In Render dashboard: New → Blueprint → point at this repository.
services:
  - type: web
    name: guj-ivms-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: guj-ivms-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://guj-ivms.vercel.app,https://live.sentinelgujarat.in"
      - key: SECRET_KEY
        generateValue: true
      - key: REQUIRE_AUTH
        value: "false" # set "true" to enforce JWT on all APIs
      - key: SIMULATOR_AUTO_START
        value: "true" # demo event generation; set "false" when real ingest nodes connect
      - key: INGEST_API_KEY
        generateValue: true
      - key: SEED_ON_STARTUP
        value: "true"
      # Sentinel Camera Grid — real stream infrastructure
      - key: SENTINEL_HLS_BASE
        value: "https://cctv.corp8.cloud"
      - key: SENTINEL_RTSP_BASE
        value: "rtsp://103.250.160.189:8554/stream"
      - key: SENTINEL_WHEP_BASE
        value: "http://103.250.160.189:8889/stream"
      # Both credentials are required — the grid's login form posts email+password.
      - key: SENTINEL_EMAIL
        sync: false  # set in Render dashboard — do NOT commit to git
      - key: SENTINEL_PASSWORD
        sync: false  # set in Render dashboard — do NOT commit to git

databases:
  - name: guj-ivms-db
    plan: free
    databaseName: guj_ivms
    user: ivms
