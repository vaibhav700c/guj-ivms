version: "3.9"

# Gujarat IVMS — full open-source stack for local/hackathon deployment.
# Cloud deployment (Render + Vercel) only uses backend/ + frontend/.

services:
  db:
    image: ghcr.io/imresamu/postgis-arm64:16-3.4 # or postgis/postgis:16-3.4 on amd64
    environment:
      POSTGRES_DB: guj_ivms
      POSTGRES_USER: ivms
      POSTGRES_PASSWORD: ivms_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ivms -d guj_ivms"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ivms
      MINIO_ROOT_PASSWORD: ivms_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  mediamtx:
    image: bluenviron/mediamtx:latest
    environment:
      MTX_PROTOCOLS: "[webrtc,hls]"
      MTX_WEBRTCADDRESSES: ":8189"
    ports:
      - "8888:8888" # HLS
      - "8189:8189/udp" # WebRTC
      - "8554:8554" # RTSP
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://ivms:ivms_secret@db:5432/guj_ivms
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
      SIMULATOR_AUTO_START: "true"
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
